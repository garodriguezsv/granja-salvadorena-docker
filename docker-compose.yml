
services:
  mysql:
    image: mysql:8.0
    container_name: granja-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - granja-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./granja-salvadorena-api
      dockerfile: Dockerfile
    container_name: granja-api
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - laravel_app:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - granja-network

  nginx:
    image: nginx:alpine
    container_name: granja-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - laravel_app:/var/www/html:ro
    depends_on:
      - api
    networks:
      - granja-network

  web:
    build:
      context: ./granja-salvadorena-web
      dockerfile: Dockerfile
    container_name: granja-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BASE_URL: http://nginx/api
    ports:
      - "3000:3000"
    depends_on:
      - nginx
    networks:
      - granja-network

volumes:
  mysql_data:
  laravel_app:

networks:
  granja-network:
    driver: bridge
